<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="coffeebg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0f0a"/>
      <stop offset="50%" style="stop-color:#2d1f14"/>
      <stop offset="100%" style="stop-color:#1c1210"/>
    </linearGradient>
    <radialGradient id="warmglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#d4a574;stop-opacity:0.06"/>
      <stop offset="100%" style="stop-color:#d4a574;stop-opacity:0"/>
    </radialGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#d4a574" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#coffeebg)"/>
  <rect width="1920" height="1080" fill="url(#dots)"/>
  <rect width="1920" height="1080" fill="url(#warmglow)"/>
  <!-- Steam wisps -->
  <path d="M 900 600 Q 910 550 900 500 Q 890 450 900 400" fill="none" stroke="#d4a574" stroke-width="1.5" opacity="0.08"/>
  <path d="M 950 620 Q 960 560 945 510 Q 935 460 950 410" fill="none" stroke="#d4a574" stroke-width="1" opacity="0.06"/>
  <path d="M 1000 610 Q 1010 560 1000 510 Q 990 460 1005 400" fill="none" stroke="#d4a574" stroke-width="1.5" opacity="0.07"/>
  <!-- Coffee cup silhouette (subtle) -->
  <ellipse cx="960" cy="700" rx="80" ry="20" fill="#3d2b1f" opacity="0.3"/>
  <rect x="900" y="650" width="120" height="50" rx="5" fill="#3d2b1f" opacity="0.2"/>
  <path d="M1020 660 Q 1060 670 1060 690 Q 1060 710 1020 700" fill="none" stroke="#3d2b1f" stroke-width="3" opacity="0.2"/>
  <!-- Warm bokeh circles -->
  <circle cx="200" cy="200" r="40" fill="#d4a574" opacity="0.03"/>
  <circle cx="1600" cy="300" r="60" fill="#b8860b" opacity="0.03"/>
  <circle cx="400" cy="800" r="50" fill="#d4a574" opacity="0.03"/>
  <circle cx="1400" cy="700" r="45" fill="#b8860b" opacity="0.03"/>
  <circle cx="700" cy="150" r="35" fill="#d4a574" opacity="0.02"/>
  <circle cx="1200" cy="900" r="55" fill="#b8860b" opacity="0.03"/>
</svg>
