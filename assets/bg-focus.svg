<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="focusbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1e3a5f" stroke-width="0.5" opacity="0.3"/>
    </pattern>
    <radialGradient id="glow1" cx="20%" cy="30%" r="30%">
      <stop offset="0%" style="stop-color:#5865F2;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#5865F2;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="25%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.06"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#focusbg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#glow1)"/>
  <rect width="1920" height="1080" fill="url(#glow2)"/>
  <!-- Circuit nodes -->
  <circle cx="300" cy="200" r="3" fill="#5865F2" opacity="0.4"/>
  <circle cx="600" cy="400" r="2" fill="#06b6d4" opacity="0.3"/>
  <circle cx="900" cy="150" r="3" fill="#5865F2" opacity="0.3"/>
  <circle cx="1200" cy="350" r="2" fill="#06b6d4" opacity="0.4"/>
  <circle cx="1500" cy="250" r="3" fill="#5865F2" opacity="0.3"/>
  <circle cx="1700" cy="500" r="2" fill="#06b6d4" opacity="0.3"/>
  <circle cx="400" cy="700" r="2" fill="#5865F2" opacity="0.3"/>
  <circle cx="1000" cy="800" r="3" fill="#06b6d4" opacity="0.3"/>
  <!-- Connection lines -->
  <line x1="300" y1="200" x2="600" y2="400" stroke="#5865F2" stroke-width="0.5" opacity="0.15"/>
  <line x1="600" y1="400" x2="900" y2="150" stroke="#06b6d4" stroke-width="0.5" opacity="0.12"/>
  <line x1="900" y1="150" x2="1200" y2="350" stroke="#5865F2" stroke-width="0.5" opacity="0.15"/>
  <line x1="1200" y1="350" x2="1500" y2="250" stroke="#06b6d4" stroke-width="0.5" opacity="0.12"/>
  <line x1="1500" y1="250" x2="1700" y2="500" stroke="#5865F2" stroke-width="0.5" opacity="0.15"/>
  <line x1="400" y1="700" x2="1000" y2="800" stroke="#06b6d4" stroke-width="0.5" opacity="0.12"/>
</svg>
